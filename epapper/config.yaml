name: e-Paper Renderer
version: "0.1.0"
slug: epapper
description: "Renders a family dashboard bitmap for a battery-powered ESP32 e-ink display."
arch:
  - aarch64
  - amd64
init: false
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:image-frame
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": "HTTP API for ESP32 (image.bin, etag, preview.png)"
options:
  refresh_debounce_seconds: 30
  calendar_entity: "calendar.family"
  weather_entity: "weather.home"
  weather_location: "Praha"
  todo_nakup_entity: "todo.nakup"
  todo_ukoly_entity: "todo.ukoly"
  battery_entity: "sensor.epaper_battery_voltage"
  transit_entities: []
  sensors:
    - title: "OBÝVÁK"
      value_entity: "sensor.obyvak_teplota"
      value_format: "{:.0f}°C"
      subtitle_entity: "sensor.obyvak_humidity"
      subtitle_format: "{:.0f}% RH"
  log_level: "info"
schema:
  refresh_debounce_seconds: "int(10,300)"
  calendar_entity: "str"
  weather_entity: "str"
  weather_location: "str"
  todo_nakup_entity: "str"
  todo_ukoly_entity: "str"
  battery_entity: "str"
  transit_entities: ["str?"]
  sensors:
    - title: "str"
      value_entity: "str"
      value_format: "str?"
      value_unit: "str?"
      subtitle: "str?"
      subtitle_entity: "str?"
      subtitle_format: "str?"
  log_level: "list(debug|info|warning|error)"
